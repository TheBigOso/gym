    <div class="testcard" id="testcard" aria-label="Test this exercise">
      <div class="trow"><h3>Test</h3><span class="tstat" id="tStat">Untested</span><span class="tpos" id="tPos"></span></div>
      <div class="tbtns">
        <button class="tb pass" id="tPass">Pass <kbd>P</kbd></button>
        <button class="tb fix" id="tFix">Needs fix <kbd>F</kbd></button>
        <button class="btn" id="tClear">Clear</button>
      </div>
      <textarea id="tNote" rows="2" placeholder="Notes: what looks wrong, and at what time (saved automatically)" aria-label="Test notes"></textarea>
      <div class="tnav">
        <button class="btn" id="tPrev">← Previous <kbd>K</kbd></button>
        <button class="btn" id="tNext">Next <kbd>J</kbd> →</button>
        <label class="tauto"><input type="checkbox" id="tAuto" checked> Go to next after marking</label>
      </div>
    </div>
